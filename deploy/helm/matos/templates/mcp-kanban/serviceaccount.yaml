{{- if .Values.mcpKanban.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matos.componentName" (dict "root" . "component" "mcp-kanban") }}
  labels:
    {{- include "matos.labels" (dict "root" . "component" "mcp-kanban") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
