{{- if .Values.executor.enabled }}
{{- $ctx := dict "root" . "component" "egress-proxy" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matos.egressProxyName" . }}
  labels:
    {{- include "matos.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.egressProxy.service.type }}
  ports:
    - name: http
      port: {{ .Values.egressProxy.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "matos.selectorLabels" $ctx | nindent 4 }}
{{- end }}
