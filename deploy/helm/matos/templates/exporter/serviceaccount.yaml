{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matos.componentName" (dict "root" . "component" "exporter") }}
  labels:
    {{- include "matos.labels" (dict "root" . "component" "exporter") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
