{{- if .Values.console.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matos.componentName" (dict "root" . "component" "console") }}
  labels:
    {{- include "matos.labels" (dict "root" . "component" "console") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
